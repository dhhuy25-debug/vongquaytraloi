    <script>
      // Compatibility shield for browser extensions attempting to monkey-patch window.fetch
      try {
        const _origFetch = window.fetch.bind(window);
        let _customFetch = _origFetch;
        Object.defineProperty(window, 'fetch', {
          get: function() { return _customFetch; },
          set: function(val) { _customFetch = val; },
          configurable: true,
          enumerable: true
        });
      } catch (e) {
        // Fallback silent
      }
    </script>
